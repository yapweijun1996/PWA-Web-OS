name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Record and verify retained release
        run: |
          mkdir recovery-artifact
          cp -R dist recovery-artifact/dist
          node scripts/release-evidence.mjs create recovery-artifact/dist recovery-artifact/manifest.json "$GITHUB_SHA"
          node scripts/release-evidence.mjs verify recovery-artifact/dist recovery-artifact/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-artifact
          retention-days: 90
          if-no-files-found: error
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
