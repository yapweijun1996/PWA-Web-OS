name: Windows desktop screen reader

on:
  workflow_dispatch:
    inputs:
      active_pages_run:
        description: Successful Pages run ID for the active release under test
        required: true
        type: string
      next_pages_run:
        description: Successful Pages run ID for the staged update
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  screen-reader:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Verify both Pages releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_RUN: ${{ inputs.active_pages_run }}
          NEXT_RUN: ${{ inputs.next_pages_run }}
        run: |
          $releases = @{ a = $env:ACTIVE_RUN; b = $env:NEXT_RUN }
          foreach ($side in $releases.Keys) {
            $id = $releases[$side]
            if ($id -notmatch '^[1-9][0-9]*$') { throw 'Provide numeric Pages run IDs' }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -or $run.path -ne '.github/workflows/pages.yml' -or $run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main') {
              throw "Run $id must be a successful push to main through Pages"
            }
            $prefix = "recovery-$($run.head_sha)-$id-"
            $available = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $artifact = $available.artifacts | Where-Object { !$_.expired -and $_.name.StartsWith($prefix) } |
              Sort-Object id -Descending | Select-Object -First 1
            if (!$artifact) { throw "No retained recovery artifact for run $id" }
            $dir = "reader-release-$side"
            gh run download $id --name $artifact.name --dir $dir
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ((Get-Content "$dir/manifest.json" -Raw | ConvertFrom-Json).commit -ne $run.head_sha) { throw 'Manifest commit mismatch' }
            node scripts/release-evidence.mjs verify "$dir/dist" "$dir/manifest.json"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Start a verified portable NVDA and read the browser journey
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP nvda_2026.3.1.exe
          $portable = Join-Path $env:RUNNER_TEMP pwa-nvda-portable
          $config = Join-Path $env:RUNNER_TEMP pwa-nvda-config
          $url = 'https://github.com/nvaccess/nvda/releases/download/release-2026.3.1/nvda_2026.3.1.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 90
          $expected = '6f80a5b0ca720a7d0d314b5be212f37388bbe81a1107ac3298c1821a1cd3f052'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $expected) { throw 'NVDA installer checksum mismatch' }
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'NVDA installer signature is invalid' }
          New-Item -ItemType Directory $portable, $config | Out-Null
          $install = Start-Process -FilePath $installer -ArgumentList '--create-portable-silent', "--portable-path=$portable" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Portable creation exit code $($install.ExitCode)" }
          $reader = Join-Path $portable nvda.exe
          if (!(Test-Path $reader -PathType Leaf)) { throw 'Portable NVDA executable not created' }
          @'
          [general]
          language = en
          showWelcomeDialogAtStartup = False
          saveConfigurationOnExit = False
          askToExit = False
          playStartAndExitSounds = False
          [speech]
          synth = espeak
          [speechViewer]
          showSpeechViewerAtStartup = True
          '@ | Set-Content "$config/nvda.ini" -Encoding utf8NoBOM
          python scripts/read-nvda-speech.py --move-cursor
          $nvda = Start-Process -FilePath $reader -ArgumentList "--config-path=$config", '--disable-addons', '--no-logging' -PassThru
          try {
            node scripts/check-desktop-reader.mts reader-release-a reader-release-b reader-evidence/nvda.json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            if (!$nvda.HasExited) {
              Start-Process -FilePath $reader -ArgumentList '--quit' -Wait
            }
          }
      - name: Retain screen reader results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screen-reader-${{ github.run_id }}-${{ github.run_attempt }}
          path: reader-evidence/
          if-no-files-found: warn
          retention-days: 90
