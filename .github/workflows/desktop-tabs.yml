name: Windows desktop browser acceptance

on:
  workflow_dispatch:
    inputs:
      pages_run:
        description: Completed Pages run ID with a retained release or candidate
        required: true
        type: string
      windows_image:
        description: Windows environment for headed browser verification
        type: choice
        default: windows-2025
        options:
          - windows-2025
          - windows-11-arm
      client_preferences:
        description: Exercise locale and Windows appearance while editing offline
        type: boolean
        default: false
      client_data_safety:
        description: Exercise two-tab stale writes and rejected backup batches
        type: boolean
        default: false
      client_keyboard_zoom:
        description: Exercise keyboard navigation and native page zoom in browser tabs
        type: boolean
        default: false
      native_apps:
        description: Install and verify both web app windows against the live release
        type: boolean
        default: false
      next_pages_run:
        description: Successful Pages push run for a compatible staged update
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  tabs:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 20
    env:
      LIVE_SITE: https://yapweijun1996.github.io/PWA-Web-OS/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify retained Pages build
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_RUN: ${{ inputs.pages_run }}
        run: |
          if ($env:PAGES_RUN -notmatch '^[1-9][0-9]*$') { throw "Expected a numeric run ID" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PAGES_RUN" | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/pages.yml' -or $run.conclusion -notin @('success', 'failure') -or $run.head_branch -ne 'main') {
            throw "Select a completed Pages run for main with a retained artifact"
          }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PAGES_RUN/artifacts" | ConvertFrom-Json
          $kind = if ($run.conclusion -eq 'success') { 'recovery' } else { 'candidate' }
          $name = "$kind-$($run.head_sha)-$env:PAGES_RUN-$($run.run_attempt)"
          $artifact = $artifacts.artifacts | Where-Object { !$_.expired -and $_.name -eq $name }
          if (!$artifact) { throw "No retained release available" }
          gh run download $env:PAGES_RUN --name $artifact.name --dir retained
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content retained/manifest.json -Raw | ConvertFrom-Json).commit -ne $run.head_sha) { throw "Unexpected manifest commit" }
          node scripts/release-evidence.mjs verify retained/dist retained/manifest.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path desktop-evidence
          Copy-Item retained/manifest.json desktop-evidence
          @{ pagesRun = $run.html_url; pagesConclusion = $run.conclusion; archive = $artifact.name; archiveDigest = $artifact.digest } | ConvertTo-Json | Set-Content desktop-evidence/source.json
      - name: Record Windows version and architecture
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $version = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          @{
            caption = $os.Caption
            version = $os.Version
            architecture = $os.OSArchitecture
            edition = $version.EditionID
            displayVersion = $version.DisplayVersion
            installationType = $version.InstallationType
            updateBuildRevision = $version.UBR
          } | ConvertTo-Json | Set-Content desktop-evidence/windows-environment.json
      - name: Install Selenium
        id: drivers
        run: python -m pip install --disable-pip-version-check selenium==4.54.0
      - name: Test installed Chrome and Firefox in desktop tabs
        shell: pwsh
        env:
          CLIENT_PREFERENCES: ${{ inputs.client_preferences }}
          CLIENT_DATA_SAFETY: ${{ inputs.client_data_safety }}
          CLIENT_KEYBOARD_ZOOM: ${{ inputs.client_keyboard_zoom }}
        run: |
          $env:CHROMEDRIVER_PATH = Join-Path $env:CHROMEWEBDRIVER chromedriver.exe
          $env:GECKODRIVER_PATH = Join-Path $env:GECKOWEBDRIVER geckodriver.exe
          $checks = @()
          if ($env:CLIENT_PREFERENCES -eq 'true') { $checks += '--client-preferences' }
          if ($env:CLIENT_DATA_SAFETY -eq 'true') { $checks += '--client-data-safety' }
          if ($env:CLIENT_KEYBOARD_ZOOM -eq 'true') { $checks += '--client-keyboard-zoom' }
          python scripts/check-desktop-tabs.py retained desktop-evidence/windows-tabs.json @checks
      - name: Measure the retained release in desktop Chrome
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/measure-performance.mjs desktop-evidence/windows-performance.json retained
      - name: Verify live bytes for native installation
        id: online
        if: ${{ !cancelled() && inputs.native_apps && steps.artifact.outcome == 'success' }}
        shell: pwsh
        run: |
          $identity = Get-Content retained/manifest.json -Raw | ConvertFrom-Json
          node scripts/release-evidence.mjs verify-hosted $env:LIVE_SITE retained/manifest.json $identity.commit
      - name: Verify native Chrome app
        if: ${{ !cancelled() && steps.online.outcome == 'success' && steps.drivers.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CHROMEDRIVER_PATH = Join-Path $env:CHROMEWEBDRIVER chromedriver.exe
          $env:GECKODRIVER_PATH = Join-Path $env:GECKOWEBDRIVER geckodriver.exe
          python scripts/check-windows-apps.py chrome $env:LIVE_SITE retained/manifest.json desktop-evidence/chrome-app.json
      - name: Verify native Firefox app
        if: ${{ !cancelled() && steps.online.outcome == 'success' && steps.drivers.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CHROMEDRIVER_PATH = Join-Path $env:CHROMEWEBDRIVER chromedriver.exe
          $env:GECKODRIVER_PATH = Join-Path $env:GECKOWEBDRIVER geckodriver.exe
          python scripts/check-windows-apps.py firefox $env:LIVE_SITE retained/manifest.json desktop-evidence/firefox-app.json
      - name: Verify the staged Pages build
        id: peer
        if: ${{ !cancelled() && inputs.next_pages_run != '' && steps.artifact.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_RUN: ${{ inputs.next_pages_run }}
        run: |
          $id = $env:NEXT_RUN
          if ($id -notmatch '^[1-9][0-9]*$') { throw 'Expected a numeric staged Pages run ID' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | ConvertFrom-Json
          if ($LASTEXITCODE -or $run.path -ne '.github/workflows/pages.yml' -or
              $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.conclusion -ne 'success') {
            throw 'Select a successful main Pages push for the staged update'
          }
          $prefix = "recovery-$($run.head_sha)-$id-"
          $available = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $artifact = $available.artifacts | Where-Object { !$_.expired -and $_.name.StartsWith($prefix) } |
            Sort-Object id -Descending | Select-Object -First 1
          if (!$artifact) { throw "No retained update artifact for run $id" }
          gh run download $id --name $artifact.name --dir retained-peer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Content retained-peer/manifest.json -Raw | ConvertFrom-Json).commit -ne $run.head_sha) {
            throw 'Unexpected staged update commit'
          }
          node scripts/release-evidence.mjs verify retained-peer/dist retained-peer/manifest.json
      - name: Verify deferred updates and recovery in retail Windows tabs
        if: ${{ !cancelled() && steps.peer.outcome == 'success' && steps.drivers.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CHROMEDRIVER_PATH = Join-Path $env:CHROMEWEBDRIVER chromedriver.exe
          $env:GECKODRIVER_PATH = Join-Path $env:GECKOWEBDRIVER geckodriver.exe
          python scripts/check-windows-updates.py retained retained-peer desktop-evidence/windows-updates.json
      - name: Verify the original Chrome shortcut after app update
        if: ${{ !cancelled() && inputs.native_apps && steps.peer.outcome == 'success' && steps.drivers.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CHROMEDRIVER_PATH = Join-Path $env:CHROMEWEBDRIVER chromedriver.exe
          python scripts/check-windows-apps.py chrome $env:LIVE_SITE retained/manifest.json desktop-evidence/chrome-app-update.json --update-from retained-peer
      - name: Verify the original Firefox shortcut after app update
        if: ${{ !cancelled() && inputs.native_apps && steps.peer.outcome == 'success' && steps.drivers.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:GECKODRIVER_PATH = Join-Path $env:GECKOWEBDRIVER geckodriver.exe
          python scripts/check-windows-apps.py firefox $env:LIVE_SITE retained/manifest.json desktop-evidence/firefox-app-update.json --update-from retained-peer
      - name: Retain desktop evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-tabs-${{ github.run_id }}-${{ github.run_attempt }}
          path: desktop-evidence/
          if-no-files-found: warn
          retention-days: 90
